[project]
name = "cdlvision"
version = "0.1.0"
description = "Frame-ingestion engine for competitive Call of Duty broadcast footage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdlvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
